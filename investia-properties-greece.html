 var a=p.price!=null?p.price:(p.band?p.band[0]:null),b=p.price!=null?p.price:(p.band?p.band[1]:null);if(a==null||b==null)return [];
 var land=isLandCat(p),o=[];
 if(isUS()){
  if(land){o.push(rngS(a/(m/ACRE),b/(m/ACRE),0," / acre"));o.push(rngS(a/(m*SQFT),b/(m*SQFT),2," / sq ft"))}
  else o.push(rngS(a/(m*SQFT),b/(m*SQFT),0," / sq ft"));
 }else{
  o.push(rngS(a/m,b/m,0," / m²"));

 }

 var yr=p.rentPer==="year",tot=basis?(m?[a*m,b*m]:null):[a,b],sm=basis?[a,b]:(m?[a/m,b/m]:null),r={};
 if(tot){r.mo=yr?[tot[0]/12,tot[1]/12]:tot;r.yr=yr?tot:[tot[0]*12,tot[1]*12]}
 if(sm){r.smMo=yr?[sm[0]/12,sm[1]/12]:sm;r.smYr=yr?sm:[sm[0]*12,sm[1]*12]}

 var tot=P*(1+A/100),noi=R*(1-O/100),pct=function(x){return (x*100).toLocaleString(loc(),{maximumFractionDigits:2})+"%"};
 $("s-out").innerHTML='<div><small>'+T("totalInv")+'<\/small><b>'+eur(Math.round(tot))+'<\/b><\/div><div><small>'+T("noi")+'<\/small><b>'+eur(Math.round(noi))+'<\/b><\/div><div><small>'+T("grossY")+'<\/small><b>'+pct(R/P)+'<\/b><\/div><div><small>'+T("netY")+'<\/small><b>'+pct(noi/tot)+'<\/b><\/div><div><small>'+T("payback")+'<\/small><b>'+(noi>0?(tot/noi).toLocaleString(loc(),{maximumFractionDigits:1})+T("years"):"—")+'<\/b><\/div>';
}

/* ---- Events ---- */
var root=$("inv-props");
root.addEventListener("click",function(e){
 var t=e.target,b;
 if((b=t.closest(".lang button"))){if(b.dataset.u){U=b.dataset.u;try{localStorage.setItem("inv-units",U)}catch(e){}}else L=b.dataset.l;build();return}
 if((b=t.closest("button.tab"))){S.cat=b.dataset.c;$("ip-landf").hidden=!showLand();tabs();grid();return}
 if(t.id==="ip-more"){advOpen=!advOpen;$("ip-adv").hidden=!advOpen;t.setAttribute("aria-expanded",advOpen);t.textContent=moreLabel();return}
 if((b=t.closest("button.open"))){modal(b.dataset.id);return}
 if((b=t.closest("[data-v]"))){var pv=byId(b.dataset.pid),av=pv&&(pv.videos||[]).filter(function(u){return vEmbed(u)}),ev=av&&vEmbed(av[+b.dataset.v]);if(ev){$("ip-mimg").classList.remove("noimg");$("ip-mimg").innerHTML=ev.t==="f"?'<iframe src="'+esc(ev.s)+'" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Video"><\/iframe>':'<video src="'+esc(ev.s)+'" controls playsinline preload="metadata"><\/video>'}return}
 if((b=t.closest("[data-th]"))){$("ip-mimg").innerHTML="";var pp=byId(b.dataset.pid),u=pp&&imgs(pp)[+b.dataset.th];if(u)$("ip-mimg").style.backgroundImage="url('"+u.replace(/'/g,"%27")+"')";return}
 if((b=t.closest("[data-s]"))){toggle(b.dataset.s);if(b.dataset.keep==="1")modal(b.dataset.s);if(b.dataset.keep==="2")shortDlg();return}
 if(t.id==="ip-shortbtn"){shortDlg();return}
 if(t.id==="ip-reset"){fresh();build();return}
 if((b=t.closest("[data-act]"))){
  var a=b.dataset.act,p=b.dataset.id&&byId(b.dataset.id);
  if(a==="close")$("ip-modal").close();
  else if(a==="access"&&p){$("ip-modal").close();accessForm(p)}
  else if(a==="info"&&p){$("ip-modal").close();infoForm(p)}
  else if(a==="sim"&&p){$("ip-modal").close();$("s-price").value=p.price;sim();$("ip-sim").scrollIntoView({behavior:"smooth"})}
  else if(a==="fclose")$("ip-form").close();
  else if(a==="sclose")$("ip-short").close();
  else if(a==="print")window.print();
  else if(a==="mail")shortForm();
  else if(a==="link")copyLink();
  else if(a==="wa")track("whatsapp_click",{id:b.dataset.id});
  else if(a==="pdflist")printPortfolio();
  else if(a==="kml"&&p){track("download_kml",{id:p.id});dlKml(p)}
  else if(a==="pdf"&&p)printPres(p);
  return;
 }
 if(t===$("ip-modal"))$("ip-modal").close();
 if(t===$("ip-form"))$("ip-form").close();
 if(t===$("ip-short"))$("ip-short").close();
});
root.addEventListener("submit",function(e){e.preventDefault();submitForm(e.target)});
root.addEventListener("change",function(e){
 var t=e.target;
 if(t.dataset.f){S.feats[t.dataset.f]=t.checked;$("ip-more").textContent=moreLabel()}
 else if(t.dataset.st){S.styles[t.dataset.st]=t.checked;$("ip-more").textContent=moreLabel()}
 else if(t.id==="ip-setting"){S.setting=t.value;$("ip-more").textContent=moreLabel()}
 else if(t.id==="ip-sea"){S.sea=t.value;$("ip-more").textContent=moreLabel()}
 else if(t.dataset.air){S.air30=t.checked;$("ip-more").textContent=moreLabel()}
 else if(t.id==="ip-gv"){S.gv=t.value;$("ip-more").textContent=moreLabel()}
 else if(t.dataset.lu){S.landUse[t.dataset.lu]=t.checked;$("ip-more").textContent=moreLabel()}
 else if(t.dataset.va){S.variety[t.dataset.va]=t.checked;$("ip-more").textContent=moreLabel()}
 else if(t.dataset.ut){S.util[t.dataset.ut]=t.checked;$("ip-more").textContent=moreLabel()}
 else if(t.id==="ip-olives"){S.olives=t.value;$("ip-more").textContent=moreLabel()}
 else if(t.id==="ip-zoning"){S.zoning=t.value;$("ip-more").textContent=moreLabel()}
 else if(t.id==="ip-access"){S.access=t.value;$("ip-more").textContent=moreLabel()}
 else if(t.id==="ip-topo"){S.topo=t.value;$("ip-more").textContent=moreLabel()}
 else if(t.id==="ip-region")S.region=t.value;
 else if(t.id==="ip-deal")S.deal=t.value;
 else if(t.id==="ip-status")S.status=t.value;
 else if(t.id==="ip-pmin"){S.pmin=+t.value;$("ip-more").textContent=moreLabel()}
 else if(t.id==="ip-pmax"){S.pmax=+t.value;$("ip-more").textContent=moreLabel()}
 else if(t.id==="ip-rooms"){S.rooms=+t.value;$("ip-more").textContent=moreLabel()}
 else if(t.id==="ip-sort")S.sort=t.value;
 else return;
 grid();
});
root.addEventListener("input",function(e){
 var id=e.target.id;
 if(id==="ip-q"){S.q=e.target.value.trim().toLowerCase();grid()}
 else if(id==="ip-amin"){S.amin=(+e.target.value||0)/(isUS()?SQFT:1);grid();$("ip-more").textContent=moreLabel()}
 else if(id==="ip-landmin"){S.landMin=(+e.target.value||0)*(isUS()?ACRE:1);grid();$("ip-more").textContent=moreLabel()}
 else if(id==="ip-client"){CLIENT=e.target.value.slice(0,60)}
 else if(id&&id.indexOf("s-")===0)sim();
});
(function(){var h=location.hash||"",m=/inv-list=([A-Za-z0-9_,\-]+)/.exec(h);if(m){m[1].split(",").forEach(function(id){if(byId(id)&&SL.indexOf(id)<0)SL.push(id)});persist()}var c=/[#&?]c=([^&]*)/.exec(h);if(c){try{CLIENT=decodeURIComponent(c[1]).replace(/[<>"'&]/g,"").slice(0,60)}catch(e){}}})();
build();
if(/inv-list=/.test(location.hash||"")&&SL.length)shortDlg();
})();
</script>
